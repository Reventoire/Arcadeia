name: Publish

on:
  push:
    tags:
      - "*"

jobs:

  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'

      - name: Create Arcadeia release keystore
        env:
          ARCADEIA_RELEASE_KEYSTORE_BASE64: ${{ secrets.ARCADEIA_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$ARCADEIA_RELEASE_KEYSTORE_BASE64"
          printf '%s' "$ARCADEIA_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/arcadeia-release.jks"

      - name: Run Assemble Artifact
        env:
          ARCADEIA_KEYSTORE_PATH: ${{ runner.temp }}/arcadeia-release.jks
          ARCADEIA_KEY_ALIAS: ${{ secrets.ARCADEIA_KEY_ALIAS }}
          ARCADEIA_STORE_PASSWORD: ${{ secrets.ARCADEIA_STORE_PASSWORD }}
          ARCADEIA_KEY_PASSWORD: ${{ secrets.ARCADEIA_KEY_PASSWORD }}
        run: |
          test -n "$ARCADEIA_KEY_ALIAS"
          test -n "$ARCADEIA_STORE_PASSWORD"
          test -n "$ARCADEIA_KEY_PASSWORD"
          ./gradlew :lemuroid-app:assembleFreeDynamicRelease --console=plain

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/arcadeia-release.jks"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: lemuroid-app/build/outputs/apk/freeDynamic/release/lemuroid-app-free-dynamic-release.apk

  publish_apk:
    name: Publish APK on Github
    needs: [ build ]
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Create pre-release
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: true
          title: "Pre-release"
          files: lemuroid-app-free-dynamic-release.apk
