name: Application identity

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Verify source identity
        run: python3 scripts/check_application_identity.py
      - uses: android-actions/setup-android@v3
      - name: Install required Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Build and lint independent debug APK
        run: ./gradlew :lemuroid-app:assembleFreeDynamicDebug :lemuroid-app:lintFreeDynamicDebug --console=plain
      - name: Verify packaged identity
        run: |
          python3 scripts/verify_apk_identity.py \
            "$ANDROID_HOME/build-tools/34.0.0/aapt" \
            lemuroid-app/build/outputs/apk/freeDynamic/debug/lemuroid-app-free-dynamic-debug.apk \
            io.github.reventoire.arcadeia.debug 'Arcadeia Debug'
